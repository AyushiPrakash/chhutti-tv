<body>
<!-- loader: a switched-off TV screen (plain black) that switches on like a real CRT right away: a pinpoint of light
     in the middle flicks out into a hot horizontal line, the line bursts open top and bottom into over-bright static
     that settles down, with the hiss of static. It stays on the static until the whole page (room photo, remote,
     fonts) has loaded, then fades into the room. -->
<div class="loader" id="loader" aria-label="Loading" role="status">
  <div class="loader-screen">
    <canvas class="loader-noise" id="loaderNoise"></canvas>
    <div class="loader-flash"></div>
  </div>
  <div class="loader-beam"></div>
  <div class="loader-glass"></div>
</div>
<script>
(function(){
  var L = document.getElementById('loader'), N = document.getElementById('loaderNoise'), raf = 0;
  // the static, drawn at a third of the window size for a coarse grain
  function noise(){
    var x = N.getContext('2d'), img = x.createImageData(N.width, N.height), d = img.data;
    for (var i = 0; i < d.length; i += 4) { var v = Math.random() * 255 | 0; d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = 255; }
    x.putImageData(img, 0, 0); raf = requestAnimationFrame(noise);
  }

  // Sound: a soft thump as the set powers on, then the hiss of static that swells as the picture opens and
  // fades with the splash. Browsers only allow sound after the visitor has interacted with the site, so on a
  // first visit it may stay silent; if they click or press a key while the static is still up, it starts then.
  var ac = null, hiss = null;
  function sound(){
    try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
    if (ac.state !== 'running') { ac.resume().then(function(){ if (!hiss && L.isConnected) start(); }, function(){}); return; }
    if (!hiss) start();
  }
  function start(){
    var t = ac.currentTime, len = ac.sampleRate * 2, buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    var src = ac.createBufferSource(); src.buffer = buf; src.loop = true;
    var hp = ac.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 400;
    var lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 7000;
    hiss = ac.createGain(); hiss.gain.setValueAtTime(0, t); hiss.gain.linearRampToValueAtTime(.09, t + .35); hiss.gain.linearRampToValueAtTime(.05, t + 1.2);
    src.connect(hp); hp.connect(lp); lp.connect(hiss); hiss.connect(ac.destination); src.start(t);
    // the power-on thump: a short low drop in pitch
    var o = ac.createOscillator(), g = ac.createGain(); o.type = 'sine';
    o.frequency.setValueAtTime(110, t); o.frequency.exponentialRampToValueAtTime(40, t + .18);
    g.gain.setValueAtTime(.18, t); g.gain.exponentialRampToValueAtTime(.001, t + .25);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + .3);
  }
  function unlock(){ if (L.isConnected && L.classList.contains('on')) sound(); }
  ['pointerdown', 'keydown'].forEach(function(e){ addEventListener(e, unlock, { once: true }); });

  // switch on as soon as the page starts, and hold on the static until everything (room photo, remote, fonts)
  // has loaded and the switch-on has played out; only then fade the whole splash away
  var opened = false, loaded = document.readyState === 'complete';
  function maybeDone(){
    if (!opened || !loaded || L.classList.contains('done')) return;
    L.classList.add('done');
    if (hiss) { var t = ac.currentTime; hiss.gain.cancelScheduledValues(t); hiss.gain.setValueAtTime(hiss.gain.value, t); hiss.gain.linearRampToValueAtTime(0, t + 1); }
    setTimeout(function(){ cancelAnimationFrame(raf); L.remove(); if (ac) ac.close(); }, 1100);
  }
  N.width = Math.ceil(innerWidth / 3); N.height = Math.ceil(innerHeight / 3); noise();
  setTimeout(function(){
    L.classList.add('on'); sound();
    setTimeout(function(){ opened = true; maybeDone(); }, 1500);
  }, 300);
  window.addEventListener('load', function(){ loaded = true; maybeDone(); });
})();
</script>
